<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with Neon Rim -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Scarf Trailing / Flowing -->
  <path d="M 60 74 C 45 74, 30 84, 18 90 C 24 96, 38 90, 52 82 Z" fill="url(#scarfGrad)" opacity="0.9" filter="url(#glow)"/>
  <path d="M 64 76 C 50 78, 32 94, 22 104 C 30 106, 46 96, 58 84 Z" fill="url(#scarfGrad)" opacity="0.75"/>

  <!-- Ninja Headband Knot -->
  <circle cx="58" cy="74" r="5" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Stickman Head -->
  <circle cx="64" cy="52" r="26" fill="#f8fafc" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Ninja Mask / Headband Strip -->
  <path d="M 40 48 Q 64 42 88 48 L 88 58 Q 64 54 40 58 Z" fill="#0b0f19"/>
  <path d="M 40 48 Q 64 42 88 48" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 40 58 Q 64 54 88 58" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- Glowing Ninja Eyes (Expressive / Determined) -->
  <polygon points="49,51 59,51 56,54 49,53" fill="#00f0ff" filter="url(#glow)"/>
  <polygon points="79,51 69,51 72,54 79,53" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Small Sparks / Energy Stars -->
  <polygon points="98,28 100,34 106,36 100,38 98,44 96,38 90,36 96,34" fill="#00f0ff" filter="url(#glow)"/>
  <polygon points="28,38 29,42 33,43 29,44 28,48 27,44 23,43 27,42" fill="#38bdf8" filter="url(#glow)"/>
</svg>
